# Local development config for `wrangler pages dev .`
# Production values (env vars, R2 binding) are set in the Cloudflare Pages dashboard.
name = "ozfurnishing-website"
compatibility_date = "2026-10-10"
pages_build_output_dir = "."

# Private bucket for inquiry submissions. Never expose this one publicly.
[[r2_buckets]]
binding = "INQUIRY_BUCKET"
bucket_name = "oz-inquiries"

[vars]
NOTIFICATION_EMAIL_TO = "807735000@qq.com"
